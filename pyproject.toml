[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-ai"
version = "0.1.0"
description = "Webcam hand-gesture control for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    # MediaPipe already depends on opencv-contrib-python. Do NOT also install
    # opencv-python: two cv2 packages in one environment clash.
    "opencv-contrib-python>=4.9",
    "mediapipe>=0.10.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
vision-ai = "vision_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
